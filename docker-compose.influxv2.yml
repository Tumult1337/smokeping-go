# gosmokeping + InfluxDB v2 stack.
#
# Quick start:
#   1. cp config.example.json config.json   # set storage.backend = "influxv2"
#   2. cp .env.example .env                 # or hand-write the vars below
#   3. docker compose -f docker-compose.influxv2.yml up -d
#   4. open http://localhost:8080
#
# Required .env vars:
#   INFLUX_URL=http://influxdb:8086
#   INFLUX_ORG=smokeping
#   INFLUX_TOKEN=<long random admin token>
#   INFLUXDB_INIT_USERNAME=admin
#   INFLUXDB_INIT_PASSWORD=<long random password>
#   INFLUXDB_INIT_BUCKET=smokeping_raw
#
# INFLUX_TOKEN is provisioned as the InfluxDB admin token on first boot AND
# used by gosmokeping to write/bootstrap. Keep the two identical. After first
# boot the volume holds state and the DOCKER_INFLUXDB_INIT_* vars are ignored.
#
# See docs/docker-master.md for the full deployment walkthrough (reverse
# proxy, cluster setup, slave nodes, day-2 ops).

services:
  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG:      ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET:   ${INFLUXDB_INIT_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    ports:
      # Bound to loopback by default. Drop the 127.0.0.1 prefix to expose the
      # InfluxDB UI on the host network, or comment out entirely if you only
      # want gosmokeping (on the compose network) to reach it.
      - "127.0.0.1:8086:8086"
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

  gosmokeping:
    build:
      context: .
      dockerfile: Dockerfile
    image: gosmokeping:latest
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./config.json:/opt/smokeping/config.json:ro
      - ./.env:/opt/smokeping/.env:ro
    # The image has cap_net_raw+ep set on the binary via setcap. Some kernels
    # strip file caps from bind-mounted layers; if ICMP probes start failing
    # with "operation not permitted", uncomment:
    # cap_add:
    #   - NET_RAW

volumes:
  influxdb-data:
  influxdb-config:
