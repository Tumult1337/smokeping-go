# gosmokeping + InfluxDB 3 Core stack.
#
# First-time bring-up (one-shot manual token bootstrap):
#   1. cp config.example.json config.json
#      Set storage.backend = "influxv3" and fill in storage.influxv3:
#        url      = http://influxdb:8181
#        token    = ${INFLUX_TOKEN}
#        database = smokeping
#   2. cp .env.example .env  (or create it; see required vars below)
#   3. docker compose -f docker-compose.influxv3.yml up -d influxdb
#   4. docker compose -f docker-compose.influxv3.yml exec influxdb \
#          influxdb3 create token --admin
#      Copy the printed token into .env as INFLUX_TOKEN.
#   5. docker compose -f docker-compose.influxv3.yml up -d gosmokeping
#      gosmokeping calls POST /api/v3/configure/database on startup, which
#      creates the "smokeping" database using the admin token.
#
# Subsequent restarts: docker compose -f docker-compose.influxv3.yml up -d
#
# Required .env vars:
#   INFLUX_URL=http://influxdb:8181
#   INFLUX_TOKEN=<admin token printed by step 4>
#
# Why no auto-setup like v2: InfluxDB 3 Core has no first-boot env-var to
# seed an admin token. Tokens live in the catalog and are created via the
# `influxdb3 create token --admin` CLI. gosmokeping's bootstrap needs an
# admin-scoped token to create the database (see CLAUDE.md), so the manual
# step is mandatory the first time.
#
# Pick v3 over v2 when slave fan-out is producing more write load than v2's
# TSM ingestion can keep up with. For single-node and small-cluster setups,
# docker-compose.influxv2.yml is the simpler default.

services:
  influxdb:
    image: influxdb:3-core
    restart: unless-stopped
    command:
      - influxdb3
      - serve
      - --node-id=gosmokeping-node-0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/var/lib/influxdb3/plugins
    volumes:
      - influxdb3-data:/var/lib/influxdb3/data
      - influxdb3-plugins:/var/lib/influxdb3/plugins
    ports:
      # Bound to loopback by default. Drop the 127.0.0.1 prefix if you want
      # to reach the v3 HTTP API from the host network.
      - "127.0.0.1:8181:8181"

  gosmokeping:
    build:
      context: .
      dockerfile: Dockerfile
    image: gosmokeping:latest
    restart: unless-stopped
    depends_on:
      - influxdb
    ports:
      - "8080:8080"
    volumes:
      - ./config.json:/opt/smokeping/config.json:ro
      - ./.env:/opt/smokeping/.env:ro
    # See note in docker-compose.influxv2.yml about NET_RAW if ICMP probes
    # fail with "operation not permitted":
    # cap_add:
    #   - NET_RAW

volumes:
  influxdb3-data:
  influxdb3-plugins:
