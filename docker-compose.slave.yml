# gosmokeping slave compose for a remote vantage point. Mirrors
# docker-compose.yml (the master) but:
#
#   - No ClickHouse — slaves never persist; they push cycles back to
#     the master over HTTP(S) under cluster.token auth.
#   - Different command: `--slave -config /opt/smokeping/config.json`
#     flips the binary into slave mode.
#   - Different volume: mounts config.slave.json instead of config.json.
#   - No port mapping — slaves only make outbound requests to the
#     master, they don't serve the UI or API.
#
# Host networking again, for the same reasons as the master:
#   - ICMP probes see the host's real interfaces (no NAT).
#   - File capabilities on the binary (cap_net_raw+ep set by Dockerfile)
#     survive across the namespace boundary.
#
# Workflow on the slave host:
#   git pull && make deploy-slave
#
# First-time setup checklist:
#   1. Copy .env.example -> .env and set CLUSTER_TOKEN to the value of
#      the master's CLUSTER_TOKEN (byte-identical). Docker compose
#      reads this file via the env_file: directive below and passes
#      the variables into the container as real env vars; the binary
#      then substitutes ${CLUSTER_TOKEN} in config.slave.json.
#   2. Copy config.slave.example.json -> config.slave.json and fill in
#      master_url, name (this is how the master and the UI label this
#      vantage point — pick something stable like "frankfurt-1"). Keep
#      "token": "${CLUSTER_TOKEN}" untouched; .env does the interpolation.
#   3. Set "advertise" to the IP other nodes can reach this host on — the
#      mesh health check probes it, and every node probes every slave. This
#      compose file uses network_mode: host, so the container sees the
#      host's real interfaces; on a bridge network or under Kubernetes the
#      container would only see its internal address (172.17.0.2), which is
#      useless to peers and identical across every slave. It is never
#      auto-detected for that reason. Leave it empty to opt this slave out
#      of health probing entirely.
#   4. Make sure the slave can reach the master's UI/API URL (DNS,
#      firewall, TLS cert if you're behind a proxy that terminates).
#   5. make deploy-slave

services:
  gosmokeping-slave:
    # Builds the image from the local source tree. To pin the prebuilt
    # image published by CI instead, comment out `build:` and use:
    #   image: ghcr.io/tumult1337/gosmokeping:latest
    build:
      context: .
      dockerfile: Dockerfile
    image: gosmokeping:latest
    container_name: gosmokeping-slave
    restart: unless-stopped
    network_mode: host
    command: ["--slave", "-config", "/opt/smokeping/config.json"]
    # env_file passes every KEY=VALUE from .env into the container as a
    # real environment variable. The binary's expandEnv() then picks
    # them up via os.LookupEnv when substituting ${VAR} placeholders in
    # config.slave.json. Used instead of bind-mounting .env because the
    # single-file mount has too many failure modes — if .env didn't
    # exist when Docker first created the container it creates an empty
    # directory at the mount path, host UID/perm mismatch against the
    # container's gosmokeping user can hide the file, etc.
    env_file:
      - .env
    volumes:
      - ./config.slave.json:/opt/smokeping/config.json:ro
    # json-file has no size cap by default — an unbounded log grows
    # forever and can fill the disk. Cap it and keep a bit of history.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # If ICMP probes start failing with "operation not permitted"
    # (some kernels strip file caps from bind-mounted layers):
    # cap_add:
    #   - NET_RAW
